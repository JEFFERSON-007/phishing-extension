<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked — Phishing Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="warning.css">
</head>
<body>
  
  <div class="page-container">
    <div class="block-card">
      
      <div class="card-header">
        <div class="icon-wrapper">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <div class="header-text">
          <h1>Connection Blocked</h1>
          <p class="subtitle">Phishing Detector prevented access to this site to protect your data.</p>
        </div>
      </div>

      <div class="details-section">
        <div class="detail-row">
          <span class="detail-label">Target URL</span>
          <code class="detail-value" id="target-url">...</code>
        </div>
        <div class="detail-row">
          <span class="detail-label">Risk Score</span>
          <div class="score-badge">
            <span id="score-val">0</span>
            <span class="score-max">/100</span>
            <span class="score-class" id="classification">Unknown</span>
          </div>
        </div>
        <div class="detail-row">
          <span class="detail-label">Detection Reason</span>
          <div class="reason-box" id="reasons-list">
            Loading...
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="btn-back">Return to Safety</button>
        <button class="btn btn-ghost" id="btn-proceed">Proceed Anyway</button>
      </div>

    </div>
  </div>

  <script src="warning.js"></script>
</body>
</html>
